<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿スケジュール | 楽天トラベルアフィリエイト 攻略サイト -UUUMマーケティング株式会社</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:   #0E7A55;
      --green-l: #17A06B;
      --green-bg:#EFF7F3;
      --gold:    #B98A1E;
      --teal:    #4FB8A5;
      --teal-d:  #2E8F7E;
      --orange:  #C97B2C;
      --line:    #E4EBE7;
      --gray:    #F6F8F7;
      --font: 'Noto Sans JP', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--gray); color: #222; min-height: 100vh; }

    /* ── HEADER ── */
    header { background: var(--green); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(14,122,85,.35); }
    .logo { font-size: 1rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: .5rem; letter-spacing: .04em; }
    .logo-badge { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); color: #fff; font-size: .72rem; font-weight: 700; padding: .18rem .65rem; border-radius: 1rem; }
    .header-link { color: rgba(255,255,255,.85); text-decoration: none; font-size: .82rem; font-weight: 700; border: 1px solid rgba(255,255,255,.35); padding: .28rem .9rem; border-radius: 1.5rem; transition: background .2s; }
    .header-link:hover { background: rgba(255,255,255,.15); }

    /* ── SUB-NAV ── */
    .sub-nav { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 1.5rem; display: flex; align-items: center; position: sticky; top: 56px; z-index: 90; box-shadow: 0 1px 4px rgba(0,0,0,.04); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sub-nav-item { display: inline-flex; align-items: center; gap: .3rem; text-decoration: none; color: #777; font-size: .8rem; font-weight: 700; padding: .72rem 1rem; border-bottom: 2.5px solid transparent; white-space: nowrap; transition: color .15s; }
    .sub-nav-item:hover { color: var(--green); }
    .sub-nav-item.active { color: var(--green); border-bottom-color: var(--green); }

    /* ── MAIN ── */
    main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    /* ── PAGE HERO ── */
    .page-hero { background: #fff; border-radius: 1rem; padding: 1.5rem 1.8rem; margin-bottom: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: flex; align-items: center; gap: 1.2rem; }
    .page-hero-icon { font-size: 2.4rem; flex-shrink: 0; }
    .page-hero-title { font-size: 1.35rem; font-weight: 900; color: #111; line-height: 1.3; }
    .page-hero-sub { font-size: .82rem; color: #777; margin-top: .3rem; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-btn { background: #fff; border: 1.5px solid #ddd; color: #666; font-family: var(--font); font-size: .78rem; font-weight: 700; padding: .35rem .9rem; border-radius: 2rem; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--green); color: var(--green); }
    .filter-btn.active { border-color: var(--green); background: var(--green); color: #fff; }
    .filter-btn.f-all    { }
    .filter-btn.f-pre    { }
    .filter-btn.f-main   { }
    .filter-btn.f-50day  { }
    .filter-btn.f-last   { }

    /* ── SECTION HEADER ── */
    .phase-header { display: flex; align-items: center; gap: .7rem; margin: 2rem 0 .9rem; }
    .phase-header-bar { width: 4px; height: 1.5rem; border-radius: 2px; flex-shrink: 0; }
    .phase-header-label { font-size: 1rem; font-weight: 900; color: #111; }
    .phase-header-range { font-size: .78rem; color: #aaa; font-weight: 700; }

    /* ── DAY CARD ── */
    .day-card { background: #fff; border-radius: 1rem; padding: 1.2rem 1.3rem; margin-bottom: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.05); border-left: 4px solid #ddd; transition: box-shadow .15s; }
    .day-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .day-card.c-announce { border-left-color: var(--orange); }
    .day-card.c-pre      { border-left-color: #17A06B; }
    .day-card.c-main     { border-left-color: var(--green); }
    .day-card.c-50day    { border-left-color: var(--teal); }
    .day-card.c-last     { border-left-color: #999; }

    .day-card-top { display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem; flex-wrap: wrap; }
    .day-date-block { min-width: 5.5rem; flex-shrink: 0; }
    .day-date-num  { font-size: 1.15rem; font-weight: 900; color: #111; line-height: 1.1; }
    .day-date-week { font-size: .72rem; font-weight: 700; color: #aaa; }
    .day-date-week.sun { color: #17A06B; }
    .day-date-week.sat { color: #4FB8A5; }
    .day-badges { display: flex; gap: .35rem; flex-wrap: wrap; flex: 1; }
    .badge-phase { font-size: .7rem; font-weight: 700; padding: .12rem .55rem; border-radius: 1rem; white-space: nowrap; }
    .bp-announce { background: #FBF3E9; color: #99631F; }
    .bp-pre      { background: #EFF7F3; color: #0E7A55; }
    .bp-main     { background: #EFF7F3; color: #0E7A55; }
    .bp-50day    { background: #EAF6F2; color: #2A9AA0; }
    .bp-last     { background: #F0F0F0; color: #666; }

    .day-theme { font-size: .88rem; font-weight: 900; color: #111; margin-bottom: .55rem; }

    .copy-block { background: var(--gray); border-radius: .65rem; padding: .85rem 1rem; margin-bottom: .65rem; }
    .copy-label { font-size: .68rem; font-weight: 900; color: #aaa; letter-spacing: .08em; margin-bottom: .3rem; }
    .copy-text  { font-size: .85rem; color: #333; line-height: 1.7; }

    .day-footer { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .dest-label { font-size: .7rem; font-weight: 700; color: #aaa; }
    .dest-link  { font-size: .75rem; font-weight: 700; color: var(--green); text-decoration: none; border: 1px solid var(--green); padding: .12rem .55rem; border-radius: 1rem; transition: background .15s, color .15s; }
    .dest-link:hover { background: var(--green); color: #fff; }

    footer { text-align:center; padding:2rem; font-size:.75rem; color:#bbb; font-weight:700; }

    /* ── AFF STRIP ── */
    .aff-strip { background:linear-gradient(90deg,#0A5B3E,#0E7A55 35%,#17A06B 65%,#0E7A55); color:#fff; padding:.95rem 1.5rem; position:sticky; top:103px; z-index:85; box-shadow:0 3px 14px rgba(14,122,85,.35); }
    .aff-strip-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:.75rem; flex-wrap:wrap; }
    .aff-strip-tag { background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35); font-size:.72rem; font-weight:900; letter-spacing:.07em; padding:.22rem .8rem; border-radius:2rem; white-space:nowrap; flex-shrink:0; }
    .aff-strip-msg { font-size:clamp(.9rem,2.5vw,1.1rem); font-weight:900; text-align:center; }

    @media (max-width: 580px) {
      header { padding: 0 1rem; }
      .sub-nav { padding: 0 .5rem; }
      .aff-strip { padding: .75rem 1rem; }
      .aff-strip-msg { font-size: .88rem; }
      main { padding: 1.2rem 1rem 4rem; }
      .page-hero { padding: 1.2rem; }
      .day-card-top { gap: .5rem; }
    }

    /* --- セール情報マスタ読み込み用 --- */
    .load-error { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
      border-radius:10px; padding:.9rem 1.1rem; margin-bottom:1rem; font-size:.85rem; font-weight:700; }
    .data-notice { color:#aaa; font-size:.7rem; font-weight:700; margin-bottom:1rem; text-align:right; }
    .ranking-label { font-size:.78rem; color:#999; font-weight:700; margin:0 0 1rem; }
    [hidden] { display:none !important; }

    /* ── LINK TOOL（最上部・リンク発行フォームへの導線） ── */
    .linktool { background:#16181f; padding:.62rem 2rem; }
    .linktool-inner { max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
    .linktool-tag { background:var(--gold); color:#241d00; font-size:.72rem; font-weight:900;
      padding:.24rem .72rem; border-radius:1rem; white-space:nowrap; }
    .linktool-msg { color:#e9e9ee; font-size:.82rem; font-weight:700; flex:1; min-width:0; }
    .linktool-btn { background:#fff; color:#16181f; text-decoration:none; font-size:.8rem; font-weight:900;
      padding:.42rem 1.15rem; border-radius:1.5rem; white-space:nowrap; transition:transform .15s, box-shadow .15s; }
    .linktool-btn:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.35); }

    /* サイト名の「-UUUMマーケティング株式会社」部分は控えめに、狭い画面では省く */
    .logo-org { font-size:.7rem; font-weight:700; color:rgba(255,255,255,.62); letter-spacing:0; }
    @media (max-width:900px) { .logo-org { display:none; } }
    @media (max-width:580px) {
      .linktool { padding:.6rem 1rem; }
      .linktool-msg { order:3; flex-basis:100%; font-size:.74rem; }
      .logo { font-size:.72rem; gap:.35rem; white-space:nowrap; }
      .logo-badge { font-size:.64rem; padding:.14rem .5rem; }
      .header-link { padding:.24rem .6rem; font-size:.72rem; }
      .hl-long { display:none; }
    }

    /* ── 常設ブロック / セールブロックの仕切り ── */
    .block-lead { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin:-.4rem 0 1rem; }
    .block-lead-note { font-size:.8rem; color:#888; font-weight:700; }
    .block-lead-note strong { color:var(--teal-d); }

    .sale-banner { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
      background:linear-gradient(135deg,var(--green) 0%,var(--green-l) 100%); color:#fff;
      border-radius:14px; padding:.85rem 1.2rem; margin:2rem 0 1.2rem;
      box-shadow:0 6px 18px rgba(14,122,85,.25); }
    .sale-banner-tag { background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4);
      font-size:.68rem; font-weight:900; padding:.2rem .65rem; border-radius:1rem; white-space:nowrap; }
    .sale-banner-text { font-size:.95rem; font-weight:900; letter-spacing:.02em; }

    .nosale-note { background:#fff; border:1px dashed #ddd; border-radius:14px;
      padding:1.4rem 1.5rem; margin:2rem 0 1rem; color:#888; font-size:.85rem;
      font-weight:700; text-align:center; }
    .nosale-note strong { color:var(--green); }

    /* ============================================================
       トンマナ：楽天トラベル寄りの緑。面はできるだけ淡くして、
       文字とカードの中身が主役になるようにしている。
       ============================================================ */
    body { background:#F7F9F8; }

    /* 最上部のリンク発行バー：黒 → 深緑 */
    .linktool { background:#0A2E22; }
    .linktool-btn { color:#0A2E22; }

    /* アフィリエイター向けの帯：ベタ塗り → 淡い緑 */
    .aff-strip { background:var(--green-bg); color:var(--green);
      border-bottom:1px solid var(--line); box-shadow:none; }
    .aff-strip-tag { background:#fff; border:1px solid var(--line); color:var(--green); }
    .aff-strip-msg { color:#1F3C31; }

    /* ヒーロー：ベタ塗り → 淡い緑のカード。文字を濃くする */
    .hero, .page-hero {
      background:linear-gradient(135deg,#F1F8F5 0%,#E3F1EA 100%);
      color:#123528; border:1px solid var(--line);
      box-shadow:0 2px 14px rgba(14,122,85,.07); }
    .hero::before, .hero::after, .page-hero::before { background:rgba(14,122,85,.05); }
    .hero-eyebrow, .page-hero-eyebrow { color:var(--teal-d); }
    .hero-title, .page-hero-title { color:#0F3427; }
    .hero-title .pct, .page-hero-title .year { color:var(--green-l); }
    .hero-sub, .page-hero-sub { color:#3B5A4D; }
    .hero-note { color:#8AA096; }
    .hero-cta { background:var(--green); color:#fff; box-shadow:0 3px 12px rgba(14,122,85,.22); }
    .hero-cta:hover { box-shadow:0 6px 18px rgba(14,122,85,.28); }

    /* 説明ボックス：青 → 緑 */
    .intro-note { background:var(--green-bg); border-color:#C3E1D2; }
    .intro-note-body { color:#25503F; }
    .intro-note-body strong { color:#0F3427; }

    /* 罫線・区切りを薄く */
    .section-title { border-bottom-color:var(--line); }
    .sub-nav { border-bottom-color:var(--line); }

    /* 開催中セールの帯：赤の主張を落とし、緑の中でのアクセントに */
    .sale-banner { background:linear-gradient(135deg,var(--green) 0%,var(--green-l) 100%);
      box-shadow:0 4px 14px rgba(14,122,85,.2); }
  </style>
</head>
<body>

<!-- LINK TOOL -->
<div class="linktool">
  <div class="linktool-inner">
    <span class="linktool-tag">🔗 リンク発行ツール</span>
    <span class="linktool-msg">アフィリエイトリンクの発行依頼はこちらのフォームから</span>
    <a class="linktool-btn" id="linkToolBtn" href="https://docs.google.com/forms/d/e/1FAIpQLSfn7iIVn5BkBTw-1lz-NK5_q6EDzIIDcNIAhyIIO3i8K_1JHQ/viewform" target="_blank" rel="noopener">フォームを開く →</a>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo" id="saleName"></div>
  <a class="header-link" id="headerLink" href="#" target="_blank" rel="noopener">公式<span class="hl-long">ページへ</span> →</a>
</header>

<!-- SUB-NAV -->
<nav class="sub-nav">
  <a href="rakuten-supersale.html"          class="sub-nav-item">📋 セール情報</a>
  <a href="rakuten-supersale-schedule.html" class="sub-nav-item active" id="navScheduleTab">📅 投稿スケジュール</a>
  <a href="rakuten-supersale-hotels.html"   class="sub-nav-item">🏨 人気ホテル一覧</a>
</nav>

<!-- AFF STRIP -->
<div class="aff-strip">
  <div class="aff-strip-inner">
    <span class="aff-strip-tag">🎯 アフィリエイター向け</span>
    <span class="aff-strip-msg">これさえ網羅すれば売上最大化できるノウハウを詰め込んだページを用意しました！</span>
  </div>
</div>

<main>

  <div class="load-error" id="loadError" hidden></div>
  <div class="data-notice" id="dataNotice" hidden></div>

  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="page-hero-icon">📅</div>
    <div>
      <div class="page-hero-title" id="schedTitle"></div>
      <div class="page-hero-sub" id="schedSub"></div>
    </div>
  </div>

  <!-- FILTER BAR（セール期間中だけ使う） -->
  <div class="filter-bar" data-section="schedFilter" id="filterBar" hidden>
    <button class="filter-btn f-all active" data-filter="all">すべて</button>
    <button class="filter-btn f-pre"  data-filter="announce">告知・先行SALE期</button>
    <button class="filter-btn f-main" data-filter="main">本SALE（通常日）</button>
    <button class="filter-btn f-50day" data-filter="50day">5と0のつく日</button>
    <button class="filter-btn f-last" data-filter="last">最終日</button>
  </div>

  <div id="scheduleList"></div>

</main>

<footer>楽天トラベル スーパーSALE 投稿スケジュール ／ 内部共有用資料</footer>

<script src="assets/sale-data.js"></script>
<script src="assets/sale-master.js"></script>

</body>
</html>
