<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人気ホテルランキング | 楽天トラベルアフィリエイト 攻略サイト -UUUMマーケティング株式会社</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #BF0000;
      --red-l:  #E60026;
      --red-bg: #FFF5F5;
      --gold:   #D4A800;
      --teal:   #5BC8CC;
      --teal-d: #3AABB0;
      --gray:   #F5F5F7;
      --font: 'Noto Sans JP', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--gray); color: #222; min-height: 100vh; }

    /* ── HEADER ── */
    header { background: var(--red); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(191,0,0,.35); }
    .logo { font-size: 1rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: .5rem; letter-spacing: .04em; }
    .logo-badge { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); color: #fff; font-size: .72rem; font-weight: 700; padding: .18rem .65rem; border-radius: 1rem; }
    .header-link { color: rgba(255,255,255,.85); text-decoration: none; font-size: .82rem; font-weight: 700; border: 1px solid rgba(255,255,255,.35); padding: .28rem .9rem; border-radius: 1.5rem; transition: background .2s; }
    .header-link:hover { background: rgba(255,255,255,.15); }

    /* ── SUB-NAV ── */
    .sub-nav { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 1.5rem; display: flex; align-items: center; position: sticky; top: 56px; z-index: 90; box-shadow: 0 1px 4px rgba(0,0,0,.04); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sub-nav-item { display: inline-flex; align-items: center; gap: .3rem; text-decoration: none; color: #777; font-size: .8rem; font-weight: 700; padding: .72rem 1rem; border-bottom: 2.5px solid transparent; white-space: nowrap; transition: color .15s; }
    .sub-nav-item:hover { color: var(--red); }
    .sub-nav-item.active { color: var(--red); border-bottom-color: var(--red); }

    /* ── AFF STRIP ── */
    .aff-strip { background: linear-gradient(90deg,#8B0000,#BF0000 35%,#E60026 65%,#BF0000); color: #fff; padding: .95rem 1.5rem; position: sticky; top: 103px; z-index: 85; box-shadow: 0 3px 14px rgba(191,0,0,.35); }
    .aff-strip-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: .75rem; flex-wrap: wrap; }
    .aff-strip-tag { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35); font-size: .72rem; font-weight: 900; letter-spacing: .07em; padding: .22rem .8rem; border-radius: 2rem; white-space: nowrap; flex-shrink: 0; }
    .aff-strip-msg { font-size: clamp(.9rem,2.5vw,1.1rem); font-weight: 900; text-align: center; }

    /* ── MAIN ── */
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    /* ── PAGE HERO ── */
    .page-hero { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%); border-radius: 1.2rem; padding: 2rem 2rem; margin-bottom: 1.5rem; color: #fff; position: relative; overflow: hidden; box-shadow: 0 6px 28px rgba(0,0,0,.2); }
    .page-hero::before { content:''; position:absolute; top:-30px; right:-30px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.04); }
    .page-hero-eyebrow { font-size:.72rem; font-weight:700; letter-spacing:.12em; color:rgba(255,255,255,.55); margin-bottom:.35rem; }
    .page-hero-title { font-size:clamp(1.3rem,3vw,1.8rem); font-weight:900; line-height:1.3; margin-bottom:.5rem; }
    .page-hero-title .year { color:#FFE566; }
    .page-hero-sub { font-size:.85rem; color:rgba(255,255,255,.75); line-height:1.6; }

    /* ── INTRO NOTE ── */
    .intro-note { background: #EEF6FF; border: 1.5px solid #90C0F0; border-radius: 1rem; padding: 1.1rem 1.3rem; margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: .9rem; }
    .intro-note-icon { font-size: 1.5rem; flex-shrink: 0; padding-top: .1rem; }
    .intro-note-body { font-size: .84rem; color: #1A4070; line-height: 1.75; }
    .intro-note-body strong { display: block; font-size: .95rem; font-weight: 900; margin-bottom: .3rem; color: #0D2A50; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .filter-label { font-size: .78rem; font-weight: 700; color: #aaa; margin-right: .25rem; }
    .filter-btn { background: #fff; border: 1.5px solid #ddd; color: #666; font-family: var(--font); font-size: .78rem; font-weight: 700; padding: .35rem .9rem; border-radius: 2rem; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--red); color: var(--red); }
    .filter-btn.active { border-color: var(--red); background: var(--red); color: #fff; }

    /* ── SECTION TITLE ── */
    .section-title { display:flex; align-items:center; gap:.6rem; font-size:1.05rem; font-weight:900; color:#111; margin-bottom:1rem; padding-bottom:.5rem; border-bottom:2px solid #e0e0e0; }
    .section-title .dot { width:8px; height:8px; border-radius:50%; background:var(--red); flex-shrink:0; }

    /* ── HOTEL SECTION ── */
    .hotel-section { margin-bottom: 2rem; }

    /* ── HOTEL GRID ── */
    .hotels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .85rem; }
    .hotels-grid.top10-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

    /* ── HOTEL CARD ── */
    .hotel-card { background: #fff; border-radius: 1rem; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s; border-top: 3px solid #ddd; }
    .hotel-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .hotel-card.rank-1 { border-top-color: #D4A800; }
    .hotel-card.rank-2 { border-top-color: #9EAAB5; }
    .hotel-card.rank-3 { border-top-color: #B87333; }
    .hotel-card.rank-top { border-top-color: var(--red); }

    .hotel-body { padding: 1rem; }
    .hotel-badges { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .55rem; align-items: center; }
    .badge-rank-medal { font-size: 1rem; line-height: 1; }
    .badge-rank-num { font-size: .68rem; font-weight: 900; background: #444; color: #fff; padding: .1rem .45rem; border-radius: .75rem; min-width: 2rem; text-align: center; }
    .badge-area { font-size: .68rem; font-weight: 700; background: #F0F0F5; color: #555; padding: .1rem .5rem; border-radius: .75rem; }
    .hotel-name { font-size: .9rem; font-weight: 900; color: #111; line-height: 1.5; margin-bottom: .75rem; }
    .hotel-btn { display: block; text-align: center; text-decoration: none; background: var(--red); color: #fff; font-size: .82rem; font-weight: 900; padding: .5rem; border-radius: .65rem; transition: background .15s; }
    .hotel-btn:hover { background: #8B0000; }

    footer { text-align:center; padding:2rem; font-size:.75rem; color:#bbb; font-weight:700; }

    @media (max-width: 580px) {
      header { padding: 0 1rem; }
      .sub-nav { padding: 0 .5rem; }
      .aff-strip { padding: .75rem 1rem; }
      .aff-strip-msg { font-size: .88rem; }
      main { padding: 1.2rem 1rem 4rem; }
      .page-hero { padding: 1.4rem 1.3rem; }
      .hotels-grid { grid-template-columns: 1fr 1fr; }
      .hotels-grid.top10-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 400px) {
      .hotels-grid { grid-template-columns: 1fr; }
    }

    /* --- セール情報マスタ読み込み用 --- */
    .load-error { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
      border-radius:10px; padding:.9rem 1.1rem; margin-bottom:1rem; font-size:.85rem; font-weight:700; }
    .data-notice { color:#aaa; font-size:.7rem; font-weight:700; margin-bottom:1rem; text-align:right; }
    .ranking-label { font-size:.78rem; color:#999; font-weight:700; margin:0 0 1rem; }
    [hidden] { display:none !important; }

    /* ── LINK TOOL（最上部・リンク発行フォームへの導線） ── */
    .linktool { background:#16181f; padding:.62rem 2rem; }
    .linktool-inner { max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
    .linktool-tag { background:var(--gold); color:#241d00; font-size:.72rem; font-weight:900;
      padding:.24rem .72rem; border-radius:1rem; white-space:nowrap; }
    .linktool-msg { color:#e9e9ee; font-size:.82rem; font-weight:700; flex:1; min-width:0; }
    .linktool-btn { background:#fff; color:#16181f; text-decoration:none; font-size:.8rem; font-weight:900;
      padding:.42rem 1.15rem; border-radius:1.5rem; white-space:nowrap; transition:transform .15s, box-shadow .15s; }
    .linktool-btn:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.35); }

    /* サイト名の「-UUUMマーケティング株式会社」部分は控えめに、狭い画面では省く */
    .logo-org { font-size:.7rem; font-weight:700; color:rgba(255,255,255,.62); letter-spacing:0; }
    @media (max-width:900px) { .logo-org { display:none; } }
    @media (max-width:580px) {
      .linktool { padding:.6rem 1rem; }
      .linktool-msg { order:3; flex-basis:100%; font-size:.74rem; }
      .logo { font-size:.72rem; gap:.35rem; white-space:nowrap; }
      .logo-badge { font-size:.64rem; padding:.14rem .5rem; }
      .header-link { padding:.24rem .6rem; font-size:.72rem; }
      .hl-long { display:none; }
    }

    /* ── 常設ブロック / セールブロックの仕切り ── */
    .block-lead { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin:-.4rem 0 1rem; }
    .block-lead-note { font-size:.8rem; color:#888; font-weight:700; }
    .block-lead-note strong { color:var(--teal-d); }

    .sale-banner { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
      background:linear-gradient(135deg,var(--red) 0%,var(--red-l) 100%); color:#fff;
      border-radius:14px; padding:.85rem 1.2rem; margin:2rem 0 1.2rem;
      box-shadow:0 6px 18px rgba(191,0,0,.25); }
    .sale-banner-tag { background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4);
      font-size:.68rem; font-weight:900; padding:.2rem .65rem; border-radius:1rem; white-space:nowrap; }
    .sale-banner-text { font-size:.95rem; font-weight:900; letter-spacing:.02em; }

    .nosale-note { background:#fff; border:1px dashed #ddd; border-radius:14px;
      padding:1.4rem 1.5rem; margin:2rem 0 1rem; color:#888; font-size:.85rem;
      font-weight:700; text-align:center; }
    .nosale-note strong { color:var(--red); }
  </style>
</head>
<body>

<!-- LINK TOOL -->

</html>
